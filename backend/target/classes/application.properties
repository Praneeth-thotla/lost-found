
spring.application.name=lost-found-portal

# Server Configuration
server.port=${PORT:8080}

# TiDB Cloud Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/lostfound?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME:LFe2CVLT6GvQpSi.root}
spring.datasource.password=${DB_PASSWORD:PbzmusPQ89Ygwb4p}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration
app.jwt.secret=${JWT_SECRET:LostFoundPortalLocalSecretKey2026_SecureKey}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}